{% extends "base.html" %}

{% block content %}
<form method="get" class="kolom-keuze">
    <label>
        <input type="textfield" name="q" value="{{ request.GET.q }}" placeholder="Zoek evenement">
    </label>
    {% for kolom, label in alle_kolommen.items %}
        <label>
            <input type="checkbox" name="kolom" value="{{ kolom }}"
                {% if kolom in gekozen_kolommen %}checked{% endif %}>
            {{ label }}
        </label>
    {% endfor %}
    <select name="categorie" id="categorie">
        <option value="" {% if not request.GET.categorie %}selected{% endif %}>Alle</option>
        {% for categorie in categorieen %}
            <option value="{{categorie.naam}}" {% if request.GET.categorie == categorie.naam %}selected{% endif %}>{{ categorie.naam }}</option>
        {% endfor %}
    </select>
    <button type="submit">Toon kolommen</button>
</form>

<table class="evenement-tabel">
    <thead>
        <tr>
            {% for label in gekozen_labels %}
                <th>{{ label }}</th>
            {% endfor %}
        </tr>
    </thead>
    <tbody>
        {% for evenement_id, waarden in rijen %}
            <tr class="evenement-rij" onclick="window.location.href='{% url "evenement_detail" id=evenement_id %}'">
                {% for waarde in waarden %}
                    <td>{{ waarde }}</td>
                {% endfor %}
            </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock content %}
