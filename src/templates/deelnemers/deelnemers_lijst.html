{% extends "base.html" %}

{% block content %}
<form method="get" class="zoekbalk">
    <label>
        <input type="textfield" name="q" value="{{ request.GET.q }}" placeholder="Zoek deelnemer">
    </label>
    <button type="submit">Zoek</button>
</form>

<table class="deelnemer-tabel">
    <thead>
        <tr>
            <th>lidnummer</th>
            <th>voornaam</th>
            <th>naam</th>
        </tr>
    </thead>
    <tbody>
        {% for deelnemer in deelnemers %}
            <tr class="deelnemer-rij {% if deelnemer.foutboodschap %}foutboodschap-tekst{% endif %}"
                onclick="window.location.href='{% url "deelnemers_detail" id=deelnemer.id %}'" 
                {% if deelnemer.foutboodschap %}title="{{deelnemer.foutboodschap}}"{% endif %}>
                <td>{{ deelnemer.id }}</td>
                <td>{{ deelnemer.voornaam }}</td>
                <td>{{ deelnemer.achternaam }}</td>
            </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock content %}
